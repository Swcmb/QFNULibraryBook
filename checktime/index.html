<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间差检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.connected {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .status.disconnected {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .time-display {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .section-title {
            color: #00d4ff;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .time-row:last-child {
            border-bottom: none;
        }
        .time-label {
            color: #888;
            font-size: 14px;
        }
        .time-value {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
        }
        .time-value.beijing {
            color: #00d4ff;
        }
        .time-value.utc {
            color: #888;
        }
        .time-value.offset {
            color: #ffaa00;
        }
        .time-value.avg {
            color: #00ff88;
        }
        .time-value.local {
            color: #ff6b6b;
        }
        .time-value.server {
            color: #4ecdc4;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-label {
            color: #666;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .stat-value.positive {
            color: #ff6b6b;
        }
        .stat-value.negative {
            color: #4ecdc4;
        }
        .history {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 300px;
            overflow-y: auto;
        }
        .history-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .history-item {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-time {
            color: #666;
        }
        .history-offset {
            font-weight: bold;
        }
        .offset-display {
            background: rgba(255, 170, 0, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            border: 1px solid rgba(255, 170, 0, 0.3);
        }
        .offset-value {
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #ffaa00;
        }
        .offset-desc {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        @media (max-width: 600px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 时间差检测系统</h1>

        <div id="status" class="status disconnected">正在连接...</div>

        <div class="time-display">
            <div class="section-title">📍 本地时间</div>
            <div class="time-row">
                <span class="time-label">北京时间</span>
                <span id="localBeijing" class="time-value local">--</span>
            </div>
            <div class="time-row">
                <span class="time-label">UTC 时间</span>
                <span id="localUtc" class="time-value utc">--</span>
            </div>

            <div class="section-title" style="margin-top: 20px;">🌐 服务器时间</div>
            <div class="time-row">
                <span class="time-label">北京时间</span>
                <span id="serverBeijing" class="time-value server">--</span>
            </div>
            <div class="time-row">
                <span class="time-label">UTC 时间</span>
                <span id="serverUtc" class="time-value utc">--</span>
            </div>

            <div class="offset-display">
                <div class="offset-value" id="offsetValue">--</div>
                <div class="offset-desc">本地时间 - 服务器时间 &nbsp;|&nbsp; 正值=本地快 &nbsp;|&nbsp; 负值=本地慢</div>
            </div>

            <div class="time-row">
                <span class="time-label">平均偏移 (<span id="sampleCount">0</span>次)</span>
                <span id="avgOffset" class="time-value avg">--</span>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">样本数</div>
                    <div id="totalSamples" class="stat-value" style="color: #00d4ff;">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">平均偏移</div>
                    <div id="avgOffsetStat" class="stat-value">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">最大偏移</div>
                    <div id="maxOffset" class="stat-value positive">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">最小偏移</div>
                    <div id="minOffset" class="stat-value negative">--</div>
                </div>
            </div>
        </div>

        <div class="history">
            <div class="history-title">历史记录 (最近 30 条)</div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/time';

        let history = [];

        function updateDisplay(data) {
            document.getElementById('localBeijing').textContent = data.local_beijing;
            document.getElementById('localUtc').textContent = data.local_utc;
            document.getElementById('serverBeijing').textContent = data.server_beijing;
            document.getElementById('serverUtc').textContent = data.server_utc;
            document.getElementById('offsetValue').textContent = data.offset_str;

            const offsetVal = data.offset;
            const offsetEl = document.getElementById('offsetValue');
            offsetEl.style.color = offsetVal > 0 ? '#ff6b6b' : '#4ecdc4';

            document.getElementById('avgOffset').textContent = data.avg_offset_str;
            document.getElementById('avgOffsetStat').textContent = data.avg_offset_str;
            document.getElementById('avgOffsetStat').style.color = data.avg_offset >= 0 ? '#ff6b6b' : '#4ecdc4';

            document.getElementById('sampleCount').textContent = data.count;
            document.getElementById('totalSamples').textContent = data.count;

            document.getElementById('maxOffset').textContent = data.max_offset_str;
            document.getElementById('minOffset').textContent = data.min_offset_str;

            history.unshift({
                local: data.local_beijing,
                server: data.server_beijing,
                offset: data.offset_str
            });
            if (history.length > 30) history.pop();

            const historyList = document.getElementById('historyList');
            historyList.innerHTML = history.map(h => `
                <div class="history-item">
                    <span>
                        <span style="color: #ff6b6b;">${h.local}</span>
                        →
                        <span style="color: #4ecdc4;">${h.server}</span>
                    </span>
                    <span class="history-offset" style="color: ${parseFloat(h.offset) > 0 ? '#ff6b6b' : '#4ecdc4'}">${h.offset}</span>
                </div>
            `).join('');
        }

        function setStatus(connected, message) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
            statusEl.textContent = message;
        }

        async function fetchTime() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API 错误');
                const data = await response.json();
                updateDisplay(data);
                setStatus(true, '✓ 已连接 - 实时同步中');
            } catch (error) {
                setStatus(false, '✗ 连接失败，请确保后端服务已启动');
                console.error('获取数据失败:', error);
            }
        }

        setStatus(false, '正在连接...');
        fetchTime();
        setInterval(fetchTime, 1000);
    </script>
</body>
</html>
